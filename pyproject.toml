[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "responsible-aied-evaluation"
version = "0.2.0"
description = "Responsible AI in education evaluation toolkit for performance, calibration, subgroup fairness, uncertainty, robustness, governance, and risk review."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = [
  "responsible-ai",
  "ai-in-education",
  "fairness",
  "calibration",
  "model-evaluation",
  "ai-governance",
  "risk-management",
  "human-oversight",
  "learning-analytics",
  "python",
]

[project.urls]
Repository = "https://github.com/devissaputra/responsible_aied_evaluation"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
