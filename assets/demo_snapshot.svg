<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
<title id="title">Responsible AIED Evaluation Toolkit synthetic demo</title>
<desc id="desc">The demo uses baseline and shifted synthetic prediction records across primary and intersectional groups plus a governance review, risk register, and study-specific thresholds.</desc>
<rect width="1200" height="365" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Synthetic responsible-AIED review demo</text>
<text x="52" y="76" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#aeb8c5">48 baseline records · 48 shifted records · 3 groups · 6 intersectional slices · synthetic only.</text>

<rect x="52" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Technical evidence</text>
<text x="70" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">performance + calibration</text>
<text x="70" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">group disparities included</text>

<rect x="320" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="338" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Uncertainty</text>
<text x="338" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">bootstrap + thresholds</text>
<text x="338" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">small groups stay visible</text>

<rect x="588" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="606" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Robustness path</text>
<text x="606" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">baseline vs shifted data</text>
<text x="606" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">metric deltas reported</text>

<rect x="856" y="112" width="292" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="874" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Governance + risk</text>
<text x="874" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">evidence · owners · mitigation</text>
<text x="874" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">four-state decision report</text>

<text x="52" y="282" font-family="Arial" font-size="14" fill="#d1d5db">The demo prints technical metrics, fairness gaps, group calibration, uncertainty, threshold sensitivity, shift deltas, and decision reasons.</text>
<text x="52" y="309" font-family="Arial" font-size="14" fill="#d1d5db">All data, thresholds, risks, and governance evidence are synthetic and must not be interpreted as deployment approval.</text>
<text x="52" y="337" font-family="Arial" font-size="13" fill="#8995a5">Run: python scripts/run_demo.py</text>
</svg>