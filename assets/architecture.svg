<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Responsible AIED evaluation research architecture</title>
<desc id="desc">UCI enrollment-time data flow through timing and audit-only feature separation, probability modeling, subgroup and calibration audit, robustness analysis, and governance evidence gaps.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="420" rx="24" fill="#f8fafc"/>
<text x="48" y="48" font-family="Arial" font-size="26" font-weight="700" fill="#0f172a">Responsible AIED evaluation · empirical architecture</text>
<text x="48" y="79" font-family="Arial" font-size="15" fill="#475569">Measurement, uncertainty and governance evidence are kept separate from deployment claims.</text>

<rect x="35" y="125" width="210" height="150" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="140" y="158" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">UCI 697</text>
<text x="140" y="185" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">4,424 student records</text>
<text x="140" y="207" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">3-state source endpoint</text>
<text x="140" y="229" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">enrollment + semester data</text>
<text x="140" y="251" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">fingerprinted at run time</text>

<line x1="255" y1="200" x2="300" y2="200" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="310" y="112" width="235" height="176" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="427" y="146" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Frozen boundaries</text>
<text x="427" y="173" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">remove semester performance</text>
<text x="427" y="195" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">hold out direct audit attributes</text>
<text x="427" y="217" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">define endpoint explicitly</text>
<text x="427" y="239" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">stratified train/test split</text>
<text x="427" y="261" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">train-only preprocessing</text>

<line x1="555" y1="200" x2="600" y2="200" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="610" y="112" width="245" height="176" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="732" y="146" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Empirical audit</text>
<text x="732" y="173" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">ROC + precision-recall</text>
<text x="732" y="195" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">probability calibration</text>
<text x="732" y="217" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">subgroup + intersectional metrics</text>
<text x="732" y="239" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">threshold sensitivity</text>
<text x="732" y="261" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">small-group non-evaluability</text>

<line x1="865" y1="200" x2="910" y2="200" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="920" y="100" width="245" height="200" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="1042" y="134" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Robustness + governance</text>
<text x="1042" y="161" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">conditional bootstrap</text>
<text x="1042" y="183" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">training-refit bootstrap</text>
<text x="1042" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">repeated splits</text>
<text x="1042" y="227" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">target sensitivity</text>
<text x="1042" y="249" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">risk register + evidence gaps</text>
<text x="1042" y="271" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">no deployment verdict</text>

<text x="48" y="352" font-family="Arial" font-size="14" fill="#475569">Predictive performance, calibration and group parity are evidence to inspect — not proof of fairness, causality, or learner benefit.</text>
</svg>
