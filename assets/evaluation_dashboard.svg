<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#fafafa"/><text x="60" y="75" font-family="Arial" font-size="36" font-weight="700">Professor Review Map</text><g font-family="Arial" font-size="22"><text x="80" y="150">1. Verify timing: enrollment-only predictors</text><text x="80" y="205">2. Verify group variables are excluded from prediction</text><text x="80" y="260">3. Inspect overall discrimination and calibration</text><text x="80" y="315">4. Inspect underlying group error rates before gaps</text><text x="80" y="370">5. Inspect threshold sensitivity and small-group warnings</text><text x="80" y="425">6. Read educational harms and governance limitations</text></g></svg>