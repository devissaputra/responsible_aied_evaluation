<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">Responsible AIED Evaluation Toolkit checklist</title>
<desc id="desc">Evaluation checklist covering technical performance, calibration, fairness, uncertainty and robustness, educational risk, and governance evidence.</desc>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1B2430">Responsible AIED Evaluation Toolkit · evaluation checklist</text>
<text x="60" y="99" font-family="Arial,sans-serif" font-size="17" fill="#5B6660">Responsible review asks whether the evidence is sufficient, not whether one score looks good.</text>

<rect x="60" y="140" width="330" height="130" rx="18" fill="#E8F1F3" stroke="#87949A"/>
<text x="82" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Performance</text>
<text x="82" y="203" font-family="Arial" font-size="14" fill="#26343B">Accuracy · precision · recall</text>
<text x="82" y="225" font-family="Arial" font-size="14" fill="#26343B">FPR · FNR · selection rate</text>

<rect x="435" y="140" width="330" height="130" rx="18" fill="#EEF3E8" stroke="#87949A"/>
<text x="457" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Calibration</text>
<text x="457" y="203" font-family="Arial" font-size="14" fill="#26343B">ECE · MCE · Brier</text>
<text x="457" y="225" font-family="Arial" font-size="14" fill="#26343B">bin tables · group calibration</text>

<rect x="810" y="140" width="330" height="130" rx="18" fill="#F5EDE4" stroke="#87949A"/>
<text x="832" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Fairness</text>
<text x="832" y="203" font-family="Arial" font-size="14" fill="#26343B">Selection · TPR · FPR · FNR gaps</text>
<text x="832" y="225" font-family="Arial" font-size="14" fill="#26343B">intersectional and sample-size review</text>

<rect x="60" y="305" width="330" height="130" rx="18" fill="#ECE8F5" stroke="#87949A"/>
<text x="82" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Uncertainty + robustness</text>
<text x="82" y="368" font-family="Arial" font-size="14" fill="#26343B">Bootstrap intervals · thresholds</text>
<text x="82" y="390" font-family="Arial" font-size="14" fill="#26343B">baseline vs shift scenarios</text>

<rect x="435" y="305" width="330" height="130" rx="18" fill="#F4EFE8" stroke="#87949A"/>
<text x="457" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Educational risk</text>
<text x="457" y="368" font-family="Arial" font-size="14" fill="#26343B">Severity · likelihood · mitigation</text>
<text x="457" y="390" font-family="Arial" font-size="14" fill="#26343B">owners · status · open risks</text>

<rect x="810" y="305" width="330" height="130" rx="18" fill="#EAF0EC" stroke="#87949A"/>
<text x="832" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Governance</text>
<text x="832" y="368" font-family="Arial" font-size="14" fill="#26343B">Privacy · accessibility · oversight</text>
<text x="832" y="390" font-family="Arial" font-size="14" fill="#26343B">appeal · rollback · monitoring</text>

<text x="60" y="488" font-family="Arial" font-size="15" fill="#5B6660">No single fairness metric, calibration statistic, checklist, or PASS state is a universal safety determination.</text>
</svg>